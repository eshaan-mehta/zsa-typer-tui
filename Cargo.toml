[package]
name = "zsa-typer-tui"
version = "0.1.0"
edition = "2024"
description = "A minimalistic TUI typing test for the ZSA Voyager"
license = "MIT"
repository = "https://github.com/eshaan-mehta/zsa-typer-tui"
keywords = ["typing", "keyboard", "zsa", "voyager", "tui"]
categories = ["command-line-utilities", "hardware-support"]

[dependencies]
anyhow = "1.0.104"
dirs = "7.0.0"
hidapi = "2.6.7"
rand = "0.10.3"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
ureq = { version = "3.4.2", features = ["json"] }
